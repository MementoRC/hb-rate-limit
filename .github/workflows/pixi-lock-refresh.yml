# Pixi Lock Refresh - CI Framework (GitHub App mode; ci-framework #406/#410)
# Refreshes pixi.lock weekly and opens (or updates) a signed bot PR as the
# pixi-lock-refresh GitHub App. App-authored PRs trigger CI natively.
# Prerequisites: the App is installed on this repo, and the repo secrets
# LOCK_REFRESH_APP_CLIENT_ID and LOCK_REFRESH_APP_PRIVATE_KEY are set.

name: Pixi Lock Refresh

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Deny all permissions by default; the job requests only what it needs.
permissions: {}

jobs:
  refresh:
    permissions:
      contents: read
    uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-pixi-lock-refresh.yml@a5dc6bd9422eb649eb071b2f79c6e0406870dc49 # v4.2.0
    with:
      target-branch: development
    secrets:
      APP_CLIENT_ID: ${{ secrets.LOCK_REFRESH_APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.LOCK_REFRESH_APP_PRIVATE_KEY }}
