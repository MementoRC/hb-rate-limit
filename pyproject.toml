[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "hb-rate-limit"
dynamic = ["version"]
description = "Stdlib-only async rate limiting primitives (pools, backoff, Retry-After) for hummingbot sub-packages"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = []

[tool.hatch.version]
path = "rate_limit/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["rate_limit"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.13"

[tool.pixi.feature.dev.dependencies]
pytest = ">=9.0.3"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=7.1.0"
pytest-timeout = ">=2.4.0"
ruff = "=0.15.10"
mypy = ">=1.20.0"
pre-commit = ">=2.15.0"

[tool.pixi.feature.ci.dependencies]
ruff = "=0.15.10"
mypy = ">=1.20.0"
pytest = ">=9.0.3"
pytest-cov = ">=7.1.0"
pytest-timeout = ">=2.4.0"
bandit = ">=1.8.0"
pre-commit = ">=2.15.0"
hatchling = ">=1.18"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
ci = { features = ["ci", "dev"], solve-group = "default" }
quality-ci = { features = ["ci", "dev"], solve-group = "default" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }

[tool.pixi.tasks]
# CI's reusable workflow runs `pixi run test`; it enforces [tool.coverage.report] fail_under.
test = "pytest tests/ --cov=rate_limit --cov-report=term-missing"
test-quick = "pytest tests/"
test-unit = "pytest tests/unit/"
test-integration = "pytest tests/integration/"
lint = "ruff check rate_limit tests"
format = "ruff format rate_limit tests"
format-check = "ruff format --check rate_limit tests"
typecheck = "mypy rate_limit"
build = "hatchling build"
coverage = "pytest tests/ --cov=rate_limit --cov-report=term-missing"
quality = { depends-on = ["lint", "format-check", "typecheck"] }
check = { depends-on = ["quality", "typecheck", "coverage"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "unit: unit tests",
    "integration: integration tests",
]
timeout = 30
addopts = "--strict-markers --strict-config -v"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM", "TCH"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source_pkgs = ["rate_limit"]
omit = ["rate_limit/__about__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = ["no cov", "if __name__", "if TYPE_CHECKING", "raise NotImplementedError", "@overload"]
# Protocol stubs: a body that is only `...` is a signature, not logic.
exclude_also = ['^\s*\.\.\.\s*$', ':\s*\.\.\.\s*$']

[tool.hummingbot.supersedes]
modules = []
test_paths = []
